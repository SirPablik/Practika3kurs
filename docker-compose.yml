services:
    laravel.test:
        image: laravelsail/php84-composer:latest
        ports:
            - "${APP_PORT:-80}:80"
        environment:
            LARAVEL_SAIL: 1
            WWWUSER: 1000
            WWWGROUP: 1000
        working_dir: /var/www/html
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - pgsql
            - redis
            - mailpit
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        command: >
            sh -c "php artisan serve --host=0.0.0.0 --port=80"

    pgsql:
        image: postgres:15
        ports:
            - "${FORWARD_DB_PORT:-5432}:5432"
        environment:
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql/data'
        networks:
            - sail

    redis:
        image: redis:alpine
        ports:
            - "${FORWARD_REDIS_PORT:-6379}:6379"
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail

    mailpit:
        image: axllent/mailpit:latest
        ports:
            - "${FORWARD_MAILPIT_PORT:-1025}:1025"
            - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"
        networks:
            - sail

networks:
    sail:
        driver: bridge

volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local